# Test-only CI. Deploy stays in azure-pipelines-cd.yml, manual and gated.
# This workflow must not call Databricks, validate a bundle, or deploy.
# .github/workflows/cd.yml stays disabled (if: false).
# Rule: .cursor/rules/azure-devops-only.mdc

name: ci

on:
  push:
    branches: [develop, ppe, main]
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "models/**"
      - "scripts/**"
      - "databricks/**"
      - "azure-pipelines/**"
      - "requirements.txt"
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
      - "azure-pipelines.yml"
      - "azure-pipelines-cd.yml"
      - "databricks.yml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: [develop, ppe, main]
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "models/**"
      - "scripts/**"
      - "databricks/**"
      - "azure-pipelines/**"
      - "requirements.txt"
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
      - "azure-pipelines.yml"
      - "azure-pipelines-cd.yml"
      - "databricks.yml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pre-commit hooks
        env:
          # The runner is checked out as develop/ppe/main. That hook is for laptops.
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files
      - name: Build the release wheel
        run: uv run python scripts/release_package.py
