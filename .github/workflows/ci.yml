# Test-only CI (uv). Runs pytest on PRs into develop, ppe, and main,
# and on pushes to those branches. main is the prod git branch.
# There is deliberately NO deploy step here — serving stays off until the
# cost sheet (docs/cost-sheet.md) and the $10 budget (docs/cost-tracker.md)
# are approved. See azure-pipelines-cd.yml / .github/workflows/cd.yml for the
# manual-only deploy path (not created as a real pipeline until approval).
#
# Minimal-run rules ("run only when absolutely required"):
# - pull_request and push for develop, ppe, and main (feature -> develop -> ppe -> main).
# - `paths` filter: docs-only edits (*.md, docs/**) do not trigger a run.
# - `concurrency` cancels superseded runs on the same ref.
# - No schedules. No workflow_dispatch (use cd.yml explicitly when approved).
#
# Toolchain: uv only. `uv sync --locked` fails closed if uv.lock is stale;
# `requirements.txt` is the compiled output (`uv pip compile --universal`)
# for Databricks/AML readers — CI never pip-installs it.

name: ci

on:
  pull_request:
    branches: [develop, ppe, main]
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "models/**"
      - "requirements.txt"
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
      - "azure-pipelines.yml"
      - "azure-pipelines-cd.yml"
      - "databricks.yml"
      - "databricks/**"
      - ".github/workflows/**"
  push:
    branches: [develop, ppe, main]
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "models/**"
      - "requirements.txt"
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
      - "azure-pipelines.yml"
      - "azure-pipelines-cd.yml"
      - "databricks.yml"
      - "databricks/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
