# DISABLED. Azure DevOps is the only CI/CD.
# Tests run in azure-pipelines.yml. Deploy runs only in azure-pipelines-cd.yml.
# Do not restore pull_request, push, or schedule on this file.
# Do not remove `if: ${{ false }}` from the job.
# Rule: .cursor/rules/azure-devops-only.mdc
#
# The steps below are kept so this file can be turned back on later.
# They do not run while the job condition is false.

name: ci

on:
  workflow_dispatch:

jobs:
  pytest:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
