# GATED CD — GitHub Actions deployment workflow for Databricks.
# Manual runs ONLY (workflow_dispatch). This workflow is DISABLED until
# docs/cost-tracker.md is approved AND the $10 budget
# (infra/budget.bicep via scripts/setup_budget.ps1 -Confirm) exists.
# It never runs on push, pull_request, or schedule, and CI
# (.github/workflows/ci.yml, azure-pipelines.yml) never references it.
#
# When enabled: runs against the `develop` environment (human approval gate),
# reads DATABRICKS_HOST / DATABRICKS_TOKEN from environment secrets, and
# deploys develop only. Shutdown order (disable this first) is in
# docs/teardown-and-restore.md.

name: cd

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm the $10 budget is active"
        required: true
        default: "NO"

concurrency:
  group: cd-develop
  cancel-in-progress: false

env:
  DATABRICKS_CLI_VERSION: "0.272.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unless explicitly confirmed
        run: |
          test "${{ inputs.confirm }}" = "YES"
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate develop bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t develop

  deploy-develop:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: develop
    steps:
      - uses: actions/checkout@v4
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Deploy develop bundle (approval gated)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy -t develop --auto-approve --force-lock
      - name: Run train-infer job pipeline
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run iris-ml-job-pipeline -t develop
      - name: Create serving endpoint without waiting
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if databricks serving-endpoints get iris-species-dev >/dev/null 2>&1; then
            echo "iris-species-dev already exists"
          else
            databricks serving-endpoints create iris-species-dev --no-wait --json '{
              "served_entities": [{
                "name": "iris_species",
                "entity_name": "dbw_iris_ml_dev.develop.iris_species",
                "entity_version": "5",
                "workload_type": "CPU",
                "workload_size": "Small",
                "scale_to_zero_enabled": true
              }]
            }'
          fi
      - name: Verify endpoint status
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks serving-endpoints get iris-species-dev
      - name: Run serving inference smoke check
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python scripts/test_serving.py --endpoint iris-species-dev --dry-run
