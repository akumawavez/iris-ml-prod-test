# DISABLED. Azure DevOps is the only CI/CD.
# Deploy only from azure-pipelines-cd.yml, and only after cost approval.
# Do not remove `if: ${{ false }}` from the jobs below.
# Rule: .cursor/rules/azure-devops-only.mdc
#
# The steps are kept so this file can be turned back on later.
# workflow_dispatch stays so the file is valid, and the job condition
# makes a manual run a no-op.
#
# Git branch develop deploys target develop, ppe deploys ppe, and main deploys
# target prod. Those targets share one workspace host today. Swap the host
# later in databricks/targets/<env>.yml. Shutdown order is in
# docs/teardown-and-restore.md.

name: cd

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm the $10 budget is active"
        required: true
        default: "NO"
      target:
        description: Databricks target. prod deploys only from git branch main
        type: choice
        options: [develop, ppe, prod]
        default: develop

concurrency:
  group: cd-${{ inputs.target }}
  cancel-in-progress: false

env:
  DATABRICKS_CLI_VERSION: "0.272.1"

jobs:
  validate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unless explicitly confirmed
        run: |
          test "${{ inputs.confirm }}" = "YES"
      - name: Match git branch to Databricks target
        run: |
          case "${{ inputs.target }}" in
            develop) expected=develop ;;
            ppe) expected=ppe ;;
            prod) expected=main ;;
            *) echo "unknown target ${{ inputs.target }}" >&2; exit 1 ;;
          esac
          test "${GITHUB_REF_NAME}" = "$expected"
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate develop, ppe, and prod bundles
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEVELOP }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEVELOP }}
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks bundle validate -t develop
          databricks bundle validate -t ppe
          databricks bundle validate -t prod

  deploy:
    if: ${{ false }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID_DEVELOP: ${{ secrets.DATABRICKS_CLIENT_ID_DEVELOP }}
      DATABRICKS_CLIENT_SECRET_DEVELOP: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEVELOP }}
      DATABRICKS_CLIENT_ID_PPE: ${{ secrets.DATABRICKS_CLIENT_ID_PPE }}
      DATABRICKS_CLIENT_SECRET_PPE: ${{ secrets.DATABRICKS_CLIENT_SECRET_PPE }}
      DATABRICKS_CLIENT_ID_PROD: ${{ secrets.DATABRICKS_CLIENT_ID_PROD }}
      DATABRICKS_CLIENT_SECRET_PROD: ${{ secrets.DATABRICKS_CLIENT_SECRET_PROD }}
    steps:
      - uses: actions/checkout@v4
      - name: Select this environment's service principal
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            develop)
              id="${DATABRICKS_CLIENT_ID_DEVELOP}"
              secret="${DATABRICKS_CLIENT_SECRET_DEVELOP}"
              ;;
            ppe)
              id="${DATABRICKS_CLIENT_ID_PPE}"
              secret="${DATABRICKS_CLIENT_SECRET_PPE}"
              ;;
            prod)
              id="${DATABRICKS_CLIENT_ID_PROD}"
              secret="${DATABRICKS_CLIENT_SECRET_PROD}"
              ;;
            *)
              echo "unknown target" >&2
              exit 1
              ;;
          esac
          test -n "${DATABRICKS_HOST}"
          test -n "${id}"
          test -n "${secret}"
          echo "::add-mask::${secret}"
          echo "DATABRICKS_CLIENT_ID=${id}" >> "$GITHUB_ENV"
          {
            echo "DATABRICKS_CLIENT_SECRET<<IRIS_SP_SECRET"
            echo "${secret}"
            echo "IRIS_SP_SECRET"
          } >> "$GITHUB_ENV"
          unset DATABRICKS_TOKEN
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Deploy selected target (approval gated)
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks bundle deploy -t ${{ inputs.target }} --auto-approve --force-lock
      - name: Run train-infer job pipeline
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks bundle run iris-ml-job-pipeline -t ${{ inputs.target }}
      - name: Point the endpoint at the alias version
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          python scripts/apply_served_version.py \
            --endpoint "${TARGET}-iris-species" \
            --model "dbw_iris_ml_dev.${TARGET}.iris_species" \
            --alias "${TARGET}"
      - name: Verify endpoint status
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks serving-endpoints get ${{ inputs.target }}-iris-species
      - name: Run serving inference smoke check
        run: |
          python scripts/test_serving.py --endpoint ${{ inputs.target }}-iris-species --dry-run
