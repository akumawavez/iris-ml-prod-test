# GATED CD — GitHub Actions deployment workflow for Databricks.
# Manual runs ONLY (workflow_dispatch). This workflow is DISABLED until
# docs/cost-tracker.md is approved AND the $10 budget
# (infra/budget.bicep via scripts/setup_budget.ps1 -Confirm) exists.
# It never runs on push, pull_request, or schedule, and CI
# (.github/workflows/ci.yml, azure-pipelines.yml) never references it.
#
# Target develop/ppe/prod all share one workspace host today. Swap the
# target host later in databricks/targets/<env>.yml. Shutdown order is in
# docs/teardown-and-restore.md.

name: cd

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm the $10 budget is active"
        required: true
        default: "NO"
      target:
        description: Bundle target to deploy
        type: choice
        options: [develop, ppe, prod]
        default: develop

concurrency:
  group: cd-${{ inputs.target }}
  cancel-in-progress: false

env:
  DATABRICKS_CLI_VERSION: "0.272.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unless explicitly confirmed
        run: |
          test "${{ inputs.confirm }}" = "YES"
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate develop, ppe, and prod bundles
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t develop
          databricks bundle validate -t ppe
          databricks bundle validate -t prod

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Deploy selected target (approval gated)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy -t ${{ inputs.target }} --auto-approve --force-lock
      - name: Run train-infer job pipeline
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run iris-ml-job-pipeline -t ${{ inputs.target }}
      - name: Create serving endpoint without waiting
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          endpoint="${TARGET}-iris-species"
          model="dbw_iris_ml_dev.${TARGET}.iris_species"
          if databricks serving-endpoints get "$endpoint" >/dev/null 2>&1; then
            echo "$endpoint already exists"
          else
            databricks serving-endpoints create --no-wait --json "$(cat <<EOF
          {
            "name": "${endpoint}",
            "config": {
              "served_entities": [{
                "name": "iris_species",
                "entity_name": "${model}",
                "entity_version": "5",
                "workload_type": "CPU",
                "workload_size": "Small",
                "scale_to_zero_enabled": true
              }]
            }
          }
          EOF
          )"
          fi
      - name: Verify endpoint status
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks serving-endpoints get ${{ inputs.target }}-iris-species
      - name: Run serving inference smoke check
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python scripts/test_serving.py --endpoint ${{ inputs.target }}-iris-species --dry-run
