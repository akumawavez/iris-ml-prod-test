# DISABLED. Azure DevOps is the only CI/CD.
# Deploy only from azure-pipelines-cd.yml, and only after cost approval.
# Do not remove `if: ${{ false }}` from the jobs below.
# Rule: .cursor/rules/azure-devops-only.mdc
#
# The steps are kept so this file can be turned back on later.
# workflow_dispatch stays so the file is valid, and the job condition
# makes a manual run a no-op.
#
# Git branch develop deploys target develop, ppe deploys ppe, and main deploys
# target prod. Those targets share one workspace host today. Swap the host
# later in databricks/targets/<env>.yml. Shutdown order is in
# docs/teardown-and-restore.md.

name: cd

# Sign-in uses the managed identity. The client secret is read from Key
# Vault after that login. Do not add the password as a GitHub secret.
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm the $10 budget is active"
        required: true
        default: "NO"
      target:
        description: Databricks target. prod deploys only from git branch main
        type: choice
        options: [develop, ppe, prod]
        default: develop
      code_version:
        description: Git SHA, or HEAD for the ref selected on this workflow
        required: true
        default: HEAD
      run_mode:
        description: serve uses an existing model. train-and-serve registers a new version
        type: choice
        options: [serve, train-and-serve]
        default: serve
      model_selector:
        description: Champion, env, or a model version number such as 13
        required: true
        default: Champion
      promote_champion:
        description: Type YES to point Champion at the served version
        required: true
        default: "NO"

concurrency:
  group: cd-${{ inputs.target }}
  cancel-in-progress: false

env:
  DATABRICKS_CLI_VERSION: "0.272.1"

jobs:
  validate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected code version
        if: success()
        run: python scripts/assert_code_version.py --expected "${{ inputs.code_version }}" --actual "${{ github.sha }}"
      - name: Refuse unless explicitly confirmed
        run: |
          test "${{ inputs.confirm }}" = "YES"
      - name: Match git branch to Databricks target
        if: success()
        run: |
          python scripts/assert_deploy_branch.py --target "${{ inputs.target }}" --branch "${GITHUB_REF_NAME}"
      - name: Sign in to Azure
        if: success()
        uses: azure/login@v2
        with:
          client-id: 3f8deddd-096f-49f0-aaac-26a97c5b3323
          tenant-id: 85f70bb6-88ac-4f15-9b5a-b6510e3141c4
          subscription-id: 1d8cc420-e891-4710-b1fa-03206d4fde2a
      - name: Fetch the develop client secret from Key Vault
        if: success()
        run: python scripts/export_keyvault_secret.py --target develop --github-env
      - name: Setup Databricks CLI
        if: success()
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate develop, ppe, and prod bundles
        if: success()
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks bundle validate -t develop
          databricks bundle validate -t ppe
          databricks bundle validate -t prod

  deploy:
    if: ${{ false }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected code version
        if: success()
        run: python scripts/assert_code_version.py --expected "${{ inputs.code_version }}" --actual "${{ github.sha }}"
      - name: Sign in to Azure
        if: success()
        uses: azure/login@v2
        with:
          client-id: 3f8deddd-096f-49f0-aaac-26a97c5b3323
          tenant-id: 85f70bb6-88ac-4f15-9b5a-b6510e3141c4
          subscription-id: 1d8cc420-e891-4710-b1fa-03206d4fde2a
      - name: Fetch this environment's client secret from Key Vault
        if: success()
        run: |
          set -euo pipefail
          python scripts/export_keyvault_secret.py --target "${{ inputs.target }}" --github-env
          unset DATABRICKS_TOKEN
          unset DATABRICKS_CLIENT_ID
          unset DATABRICKS_CLIENT_SECRET
      - name: Setup Databricks CLI
        if: success()
        uses: databricks/setup-cli@v1.19.0
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Deploy selected target (approval gated)
        if: success()
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks bundle deploy -t ${{ inputs.target }} --auto-approve --force-lock
      - name: Run train job
        if: success() && inputs.run_mode == 'train-and-serve'
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks bundle run iris-ml-train -t ${{ inputs.target }}
      - name: Run infer job
        if: success() && inputs.run_mode == 'train-and-serve'
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          eval "$(python scripts/resolve_manual_release.py --selector "${{ inputs.model_selector }}" --env "${{ inputs.target }}")"
          databricks bundle run iris-ml-infer -t ${{ inputs.target }} --params "model_uri=${uri}"
      - name: Point the endpoint at the selected model version
        if: success()
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          eval "$(python scripts/resolve_manual_release.py --selector "${{ inputs.model_selector }}" --env "${TARGET}")"
          python scripts/apply_served_version.py \
            --endpoint "iris-species-${TARGET}" \
            --model "dbw_iris_ml_dev.${TARGET}.iris_species" \
            --alias "${alias}" \
            --version "${version}" \
            --env-alias "${TARGET}" \
            --promote-champion "${{ inputs.promote_champion }}"
      - name: Verify endpoint status
        if: success()
        run: |
          set -euo pipefail
          unset DATABRICKS_TOKEN
          python scripts/cd_require_service_principal.py
          databricks serving-endpoints get iris-species-${{ inputs.target }}
      - name: Run serving inference smoke check
        if: success()
        run: |
          python scripts/test_serving.py --endpoint iris-species-${{ inputs.target }} --dry-run
