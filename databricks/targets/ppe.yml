targets:
  ppe:
    mode: production
    # Same host as develop until PPE has its own workspace. Override workspace_host then.
    workspace:
      host: ${var.workspace_host}
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: ppe
      git_branch: ppe
      env_suffix: ppe
      service_principal_application_id: 70914310-8ae1-4fef-be8e-79727c341b8d
