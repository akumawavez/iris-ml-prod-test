resources:
  jobs:
    iris-ml-job-pipeline:
      name: iris-ml-job-pipeline
      description: >-
        Train then batch-infer iris. Serving endpoint iris-species-dev is
        deployed with this Databricks Asset Bundle.
      tags:
        project: iris-ml
        env: develop
        task: pipeline
        compute: serverless
        managed-by: dab
        owner: ${var.owner}
      tasks:
        - task_key: train
          spark_python_task:
            python_file: ../../notebooks/train_register.py
            parameters:
              - --experiment
              - ${var.experiment_name}
              - --tracking-uri
              - databricks
              - --registered-name
              - ${var.registered_model_name}
              - --register
          environment_key: default
        - task_key: infer
          depends_on:
            - task_key: train
          spark_python_task:
            python_file: ../../notebooks/infer.py
            parameters:
              - --model-uri
              - models:/${var.registered_model_name}
              - --tracking-uri
              - databricks
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ../../requirements-serving.txt
