resources:
  jobs:
    iris-ml-job-pipeline:
      name: ${var.env_prefix}-iris-ml-job-pipeline
      description: >-
        Train then batch-infer iris for ${var.env}. Serving endpoint
        ${var.endpoint_name} is deployed with this Databricks Asset Bundle.
        Registered model alias is ${var.model_alias} (and Champion).
      tags:
        project: iris-ml
        env: ${var.env}
        stage: ${var.env}
        alias: ${var.model_alias}
        task: pipeline
        compute: serverless
        managed-by: dab
        owner: ${var.owner}
      tasks:
        - task_key: train
          spark_python_task:
            python_file: ../../notebooks/train_register.py
            parameters:
              - --experiment
              - ${var.experiment_name}
              - --tracking-uri
              - databricks
              - --registered-name
              - ${var.registered_model_name}
              - --register
              - --alias
              - ${var.model_alias}
              - --env
              - ${var.env}
          environment_key: default
        - task_key: infer
          depends_on:
            - task_key: train
          spark_python_task:
            python_file: ../../notebooks/infer.py
            parameters:
              - --model-uri
              - models:/${var.registered_model_name}@${var.model_alias}
              - --tracking-uri
              - databricks
              - --alias
              - ${var.model_alias}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ../../requirements-serving.txt
