resources:
  model_serving_endpoints:
    iris_species:
      name: iris-species-${var.env_suffix}
      tags:
        - key: project
          value: iris-ml
        - key: env
          value: ${var.env_suffix}
        - key: stage
          value: ${var.env_suffix}
        - key: alias
          value: ${var.env_suffix}
        - key: managed-by
          value: dab
        - key: owner
          value: ${var.owner}
      config:
        served_entities:
          - name: iris_species
            entity_name: dbw_iris_ml_dev.${var.env_suffix}.iris_species
            # Included with the bundle. scripts/apply_served_version.py
            # still sets entity_version from the alias after deploy.
            entity_version: ${var.model_version}
            workload_type: CPU
            workload_size: Small
            scale_to_zero_enabled: true
