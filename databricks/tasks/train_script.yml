resources:
  jobs:
    iris-train-script-serverless:
      name: iris-train-script-serverless
      tags:
        project: iris-ml
        env: develop
        task: script
        compute: serverless
        managed-by: dab
        owner: ${var.owner}
      tasks:
        - task_key: train_script
          spark_python_task:
            python_file: ../../notebooks/train_register.py
            parameters:
              - --experiment
              - ${var.experiment_name}
              - --tracking-uri
              - databricks
              - --registered-name
              - ${var.registered_model_name}
              - --register
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - "-r ../../requirements-serving.txt"
