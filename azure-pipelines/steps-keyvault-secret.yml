# Sign in with service connection sc-iris-keyvault, then read one secret.
# That connection is the managed identity id-iris-ml. It has no password.
# The client secret is not stored in GitHub and is not copied into the
# variable group. AzureKeyVault marks the downloaded value as a secret.

parameters:
  - name: secretName
    type: string
  - name: azureSubscription
    type: string
    default: sc-iris-keyvault
  - name: keyVaultName
    type: string
    default: kv-iris-ml-dev-7405

steps:
  - task: AzureKeyVault@2
    displayName: Fetch ${{ parameters.secretName }} from Key Vault
    condition: succeeded()
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      KeyVaultName: ${{ parameters.keyVaultName }}
      SecretsFilter: ${{ parameters.secretName }}
  - script: |
      set -euo pipefail
      test -n "$KEYVAULT_SECRET"
      echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$KEYVAULT_SECRET"
    displayName: Set ARM_CLIENT_SECRET from Key Vault
    condition: succeeded()
    env:
      KEYVAULT_SECRET: $(${{ parameters.secretName }})
