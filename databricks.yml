bundle:
  name: iris-ml-prod-test

variables:
  env:
    description: Target environment name used in tags, prefixes, and aliases.
    default: develop
  git_branch:
    description: Git branch allowed to deploy this target. prod is deployed from main.
    default: develop
  env_suffix:
    description: Environment name appended to jobs, endpoints, and experiments. Git branch main selects suffix prod.
    default: develop
  model_version:
    description: Served UC model version. Bump after a new version is registered.
    default: "5"
  owner:
    description: Short owner name applied as a tag only (no auth semantics).
    default: iris-learn
  service_principal_application_id:
    description: Entra application id that deploys and runs this environment. Not a secret.
    default: 529f55f8-5bbd-4921-b041-5348ed4e741b

# uv builds src/iris_model. bundle deploy uploads the wheel and the job
# environment installs it on the compute. Tasks import iris_model; they do
# not pip-install the library or put src on sys.path.
artifacts:
  iris_model:
    type: whl
    path: .
    build: uv build --wheel
    dynamic_version: true

include:
  # Serving endpoint stays in databricks/artifacts/ but is applied by CD via
  # `serving-endpoints create --no-wait`. Putting it in the bundle made
  # `bundle deploy` wait on container creation and blocked the job run.
  # Only the train-then-infer pipeline is deployed. Standalone train and
  # infer jobs never ran, so they are not in this bundle.
  - databricks/jobs/*.yml
  - databricks/targets/*.yml
