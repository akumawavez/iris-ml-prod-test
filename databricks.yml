bundle:
  name: iris-ml-prod-test

variables:
  env:
    description: Target environment name used in tags, prefixes, and aliases.
    default: develop
  git_branch:
    description: Git branch allowed to deploy this target. prod is deployed from main.
    default: develop
  env_prefix:
    description: Resource-name prefix so develop/ppe/prod can share one workspace. Git branch main selects env prod.
    default: develop
  registered_model_name:
    description: Unity Catalog model for registration (catalog.schema.model).
    default: dbw_iris_ml_dev.develop.iris_species
  model_alias:
    description: Unity Catalog alias pointed at the version this env serves.
    default: develop
  model_version:
    description: Served UC model version. Bump after a new version is registered.
    default: "5"
  endpoint_name:
    description: Workspace-unique serving endpoint name.
    default: develop-iris-species
  experiment_name:
    description: MLflow experiment name (auto-prefixed with /Users/<you>/ on Databricks).
    default: develop-iris-species
  owner:
    description: Short owner name applied as a tag only (no auth semantics).
    default: iris-learn

include:
  # Serving endpoint stays in databricks/artifacts/ but is applied by CD via
  # `serving-endpoints create --no-wait`. Putting it in the bundle made
  # `bundle deploy` wait on container creation and blocked the job run.
  # Only the train-then-infer pipeline is deployed. Standalone train and
  # infer jobs never ran, so they are not in this bundle.
  - databricks/jobs/*.yml
  - databricks/targets/*.yml
