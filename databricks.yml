bundle:
  name: iris-ml-prod-test

# uv builds src/iris_model. bundle deploy uploads the wheel and the job
# environment installs it on the compute. Tasks import iris_model; they do
# not pip-install the library or put src on sys.path.
artifacts:
  iris_model:
    type: whl
    path: .
    build: uv build --wheel
    dynamic_version: true

include:
  - databricks/variables.yml
  - databricks/artifacts/*.yml
  - databricks/jobs/*.yml
  - databricks/targets/*.yml
