# Local gate. CI runs the same file with SKIP=no-commit-to-branch, because that
# hook is for a laptop commit on develop/ppe/main, not for the CI checkout.
# Install once with `uv run pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
        exclude: ^uv\.lock$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-case-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, ppe, --branch, main]

  - repo: local
    hooks:
      - id: forbid-secret-files
        name: Block secret files
        entry: python3 scripts/precommit/forbid_secret_files.py
        language: system
        pass_filenames: true
      - id: forbid-token-literals
        name: Block token and private-key literals
        entry: python3 scripts/precommit/forbid_token_literals.py
        language: system
        pass_filenames: true
      - id: forbid-ci-deploy
        name: Keep deploy out of CI workflows
        entry: python3 scripts/precommit/forbid_ci_deploy.py
        language: system
        pass_filenames: true
        files: (^azure-pipelines\.yml$|^\.github/workflows/ci\.yml$)
