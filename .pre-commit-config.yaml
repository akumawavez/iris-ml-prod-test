# Local gate. CI runs the same file with SKIP=no-commit-to-branch, because that
# hook is for a laptop commit on develop/ppe/main, not for the CI checkout.
# Install once with `uv run pre-commit install`. That installs pre-commit and
# pre-push. pre-push runs pytest only. The commit hook stays fast.
# default_stages keeps the other hooks off pre-push. Without it, pre-commit 4
# runs every hook on push, and no-commit-to-branch blocks publishing develop.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^\.agents/
      - id: ruff-format
        exclude: ^\.agents/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.(ipynb|lock)$|^\.agents/)
      - id: end-of-file-fixer
        exclude: (\.(ipynb|lock)$|^\.agents/)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: (\.(ipynb|lock)$|^\.agents/)
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
        exclude: ^uv\.lock$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-illegal-windows-names
      - id: check-executables-have-shebangs
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, ppe, --branch, main]

  - repo: local
    hooks:
      - id: forbid-secret-files
        name: Block secret files
        entry: python3 scripts/precommit/forbid_secret_files.py
        language: system
        pass_filenames: true
      - id: forbid-token-literals
        name: Block token and private-key literals
        entry: python3 scripts/precommit/forbid_token_literals.py
        language: system
        pass_filenames: true
      - id: forbid-ci-deploy
        name: Keep deploy out of CI workflows
        entry: python3 scripts/precommit/forbid_ci_deploy.py
        language: system
        pass_filenames: true
        files: (^azure-pipelines\.yml$|^\.github/workflows/ci\.yml$)
      - id: pytest-pre-push
        name: pytest before push
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
