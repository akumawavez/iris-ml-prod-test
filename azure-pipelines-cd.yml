# GATED CD — Azure DevOps deployment pipeline for Databricks.
# DO NOT run until docs/cost-tracker.md is approved AND the $10 budget
# (infra/budget.bicep via scripts/setup_budget.ps1 -Confirm) exists.
#
# Operational rules:
# - Manual runs only (trigger: none, pr: none). It never fires on push or PR.
# - envSuffix is one variable, chosen from the branch you queue:
#   develop -> develop, ppe -> ppe, main -> prod.
# - There is one deploy stage. It uses approval environment iris-<envSuffix>
#   and variable group iris-<envSuffix>. It does not copy the stage per env.
# - Resource names end with that suffix: iris-species-develop,
#   iris-ml-train-develop, iris-ml-infer-develop, and the same pattern for ppe and prod.
# - A manual run from any other branch fails. Feature branches never deploy.
# - Type YES in the confirm parameter. The cost tracker must already be approved.
# - Run pipeline on the branch for that environment. codeVersion HEAD uses
#   the commit you select there. modelSelector is Champion, env, or a
#   version number. runMode serve does not train and does not start the
#   infer job. promoteChampion YES moves the Champion alias.
# - The variable group is on the validate and deploy stages for that suffix.
#   It holds the host and client id. The client secret is read from Key Vault
#   kv-iris-ml-dev-7405 after service connection sc-iris-keyvault signs in.
#   It is not on the pipeline root, so another environment's settings are not loaded.
# - Full shutdown procedure (disable this pipeline first) lives in
#   docs/teardown-and-restore.md.

trigger: none
pr: none

parameters:
  - name: confirm
    displayName: Type YES. docs/cost-tracker.md must be approved.
    type: string
    default: "NO"
  - name: codeVersion
    displayName: Git commit. HEAD uses the commit you select in Run pipeline.
    type: string
    default: HEAD
  - name: runMode
    displayName: serve uses an existing model. train-and-serve registers a new version.
    type: string
    default: serve
    values:
      - serve
      - train-and-serve
  - name: modelSelector
    displayName: Champion, env, or a model version number such as 13.
    type: string
    default: Champion
  - name: promoteChampion
    displayName: Type YES to point Champion at the served version.
    type: string
    default: "NO"

pool:
  vmImage: ubuntu-latest

variables:
  - name: DATABRICKS_CLI_VERSION
    value: "0.272.1"
  - name: UV_VERSION
    value: "0.11.28"
  - name: codeVersion
    value: ${{ parameters.codeVersion }}
  - name: runMode
    value: ${{ parameters.runMode }}
  - name: modelSelector
    value: ${{ parameters.modelSelector }}
  - name: promoteChampion
    value: ${{ parameters.promoteChampion }}
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      - name: envSuffix
        value: prod
  - ${{ if eq(variables['Build.SourceBranchName'], 'ppe') }}:
      - name: envSuffix
        value: ppe
  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
      - name: envSuffix
        value: develop

stages:
  - stage: gate
    displayName: Confirm the run
    jobs:
      - job: gate
        displayName: Require YES and an allowed branch
        timeoutInMinutes: 5
        steps:
          - checkout: none
          - script: |
              set -euo pipefail
              test "${{ parameters.confirm }}" = "YES"
            displayName: Require YES
            condition: succeeded()
          - script: |
              set -euo pipefail
              case "$(Build.SourceBranch)" in
                refs/heads/develop|refs/heads/ppe|refs/heads/main)
                  echo "CD branch $(Build.SourceBranchName) deploys suffix $(envSuffix)"
                  ;;
                *)
                  echo "CD only runs from develop, ppe, or main. This run is $(Build.SourceBranch)." >&2
                  exit 1
                  ;;
              esac
            displayName: Refuse unless branch is develop, ppe, or main
            condition: succeeded()
          - script: |
              set -euo pipefail
              python scripts/assert_code_version.py --expected "$(codeVersion)" --actual "$(Build.SourceVersion)"
            displayName: Require the selected code version
            condition: succeeded()

  - ${{ if in(variables['Build.SourceBranchName'], 'develop', 'ppe', 'main') }}:
      - stage: validate
        displayName: Validate $(envSuffix) bundle (no spend)
        dependsOn: gate
        condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/ppe', 'refs/heads/main'))
        jobs:
          - job: validate
            displayName: Validate Databricks Asset Bundle
            timeoutInMinutes: 20
            variables:
              - group: iris-${{ variables.envSuffix }}
            steps:
              - checkout: self
                fetchDepth: 1
                persistCredentials: false
                clean: true
              - template: azure-pipelines/steps-keyvault-secret.yml
                parameters:
                  secretName: sp-iris-${{ variables.envSuffix }}-client-secret
                  continueOnMissing: "true"
              - template: azure-pipelines/steps-databricks-cli.yml
              - template: azure-pipelines/steps-databricks-command.yml
                parameters:
                  displayName: Validate $(envSuffix) bundle
                  allowMissingIdentity: "true"
                  script: python scripts/bundle_validate.py --allow-missing -t $(envSuffix)

      - template: azure-pipelines/cd-deploy-stage.yml
