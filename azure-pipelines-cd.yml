# GATED CD — Azure DevOps deployment pipeline for Databricks.
# DO NOT run until docs/cost-tracker.md is approved AND the $10 budget
# (infra/budget.bicep via scripts/setup_budget.ps1 -Confirm) exists.
#
# Operational rules:
# - Manual runs only (trigger: none, pr: none). It never fires on push or PR.
# - The deploy stage targets the `iris-develop` ENVIRONMENT, which holds the
#   human approval gate, and reads secrets from the `iris-develop` VARIABLE
#   GROUP (never from YAML). See docs/secrets.md.
# - Deploys develop only: `databricks bundle deploy -t develop`. ppe/prod
#   stay empty-host until the promotion runbook says otherwise.
# - Full shutdown procedure (disable this pipeline first) lives in
#   docs/teardown-and-restore.md.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: iris-develop
  - name: DATABRICKS_CLI_VERSION
    value: "0.272.1"

stages:
  - stage: validate
    displayName: Validate bundle (no spend)
    jobs:
      - job: validate
        displayName: Validate Databricks Asset Bundle
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              mkdir -p "$HOME/.local/bin"
              curl -fsSL -o /tmp/databricks.zip \
                "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
              unzip -o /tmp/databricks.zip databricks -d "$HOME/.local/bin"
              echo "##vso[task.prependpath]$HOME/.local/bin"
              databricks version
            displayName: Install Databricks CLI
          - script: |
              databricks bundle validate -t develop
            displayName: Validate develop bundle
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  - stage: deploy_develop
    displayName: Deploy iris-species-dev (approval gated)
    dependsOn: validate
    jobs:
      - deployment: deploy
        displayName: Deploy endpoint to Databricks
        environment: iris-develop
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    set -euo pipefail
                    mkdir -p "$HOME/.local/bin"
                    curl -fsSL -o /tmp/databricks.zip \
                      "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
                    unzip -o /tmp/databricks.zip databricks -d "$HOME/.local/bin"
                    echo "##vso[task.prependpath]$HOME/.local/bin"
                    databricks version
                  displayName: Install Databricks CLI
                - script: |
                    databricks bundle deploy -t develop --auto-approve --force-lock
                  displayName: Deploy develop endpoint
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                - script: |
                    databricks bundle run iris-ml-job-pipeline -t develop
                  displayName: Run train-infer job pipeline
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                - script: |
                    if databricks serving-endpoints get iris-species-dev >/dev/null 2>&1; then
                      echo "iris-species-dev already exists"
                    else
                      databricks serving-endpoints create --no-wait --json '{
                        "name": "iris-species-dev",
                        "config": {
                          "served_entities": [{
                            "name": "iris_species",
                            "entity_name": "dbw_iris_ml_dev.develop.iris_species",
                            "entity_version": "5",
                            "workload_type": "CPU",
                            "workload_size": "Small",
                            "scale_to_zero_enabled": true
                          }]
                        }
                      }'
                    fi
                  displayName: Create serving endpoint without waiting
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                - script: |
                    databricks serving-endpoints get iris-species-dev
                  displayName: Verify endpoint status
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                - script: |
                    python scripts/test_serving.py --endpoint iris-species-dev --dry-run
                  displayName: Run serving inference smoke check
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
