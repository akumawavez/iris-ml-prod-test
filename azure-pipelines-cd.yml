# GATED CD — Azure DevOps deployment pipeline for Databricks.
# DO NOT run until docs/cost-tracker.md is approved AND the $10 budget
# (infra/budget.bicep via scripts/setup_budget.ps1 -Confirm) exists.
#
# Operational rules:
# - Manual runs only (trigger: none, pr: none). It never fires on push or PR.
# - Each deploy stage uses an ENVIRONMENT approval gate (iris-develop / iris-ppe
#   / iris-prod) Develop reads variable group `iris-develop`. PPE and prod override with `iris-ppe` and `iris-prod`. Each group holds that environment's service principal.
# - Git branch develop deploys target develop, ppe deploys ppe, and main
#   deploys target prod. They share one Databricks host today. Change the host
#   later in databricks/targets/<env>.yml. See docs/secrets.md.
# - Full shutdown procedure (disable this pipeline first) lives in
#   docs/teardown-and-restore.md.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: iris-develop
  - name: DATABRICKS_CLI_VERSION
    value: "0.272.1"

stages:
  - stage: validate
    displayName: Validate bundle (no spend)
    jobs:
      - job: validate
        displayName: Validate Databricks Asset Bundle
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              mkdir -p "$HOME/.local/bin"
              curl -fsSL -o /tmp/databricks.zip \
                "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
              unzip -o /tmp/databricks.zip databricks -d "$HOME/.local/bin"
              echo "##vso[task.prependpath]$HOME/.local/bin"
              databricks version
            displayName: Install Databricks CLI
          - script: |
              set -euo pipefail
              unset DATABRICKS_TOKEN
              python scripts/cd_require_service_principal.py
              databricks bundle validate -t develop
              databricks bundle validate -t ppe
              databricks bundle validate -t prod
            displayName: Validate develop, ppe, and prod bundles
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

  - stage: deploy_develop
    displayName: Deploy develop-iris-species (approval gated)
    dependsOn: validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: deploy
        displayName: Deploy develop target
        environment: iris-develop
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    set -euo pipefail
                    mkdir -p "$HOME/.local/bin"
                    curl -fsSL -o /tmp/databricks.zip \
                      "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
                    unzip -o /tmp/databricks.zip databricks -d "$HOME/.local/bin"
                    echo "##vso[task.prependpath]$HOME/.local/bin"
                    databricks version
                  displayName: Install Databricks CLI
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks bundle deploy -t develop --auto-approve --force-lock
                  displayName: Deploy develop bundle
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks bundle run iris-ml-job-pipeline -t develop
                  displayName: Run train-infer job pipeline
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    python scripts/apply_served_version.py \
                      --endpoint develop-iris-species \
                      --model dbw_iris_ml_dev.develop.iris_species \
                      --alias develop
                  displayName: Point the endpoint at the alias version
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                    TARGET: develop
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks serving-endpoints get develop-iris-species
                  displayName: Verify endpoint status
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    python scripts/test_serving.py --endpoint develop-iris-species --dry-run
                  displayName: Run serving inference smoke check
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

  - stage: deploy_ppe
    displayName: Deploy ppe-iris-species (approval gated)
    dependsOn: validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/ppe'))
    variables:
      - group: iris-ppe
    jobs:
      - deployment: deploy
        displayName: Deploy ppe target
        environment: iris-ppe
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    set -euo pipefail
                    mkdir -p "$HOME/.local/bin"
                    curl -fsSL -o /tmp/databricks.zip \
                      "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
                    unzip -o /tmp/databricks.zip databricks -d "$HOME/.local/bin"
                    echo "##vso[task.prependpath]$HOME/.local/bin"
                    databricks version
                  displayName: Install Databricks CLI
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks bundle deploy -t ppe --auto-approve --force-lock
                  displayName: Deploy ppe bundle
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks bundle run iris-ml-job-pipeline -t ppe
                  displayName: Run train-infer job pipeline
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    python scripts/apply_served_version.py \
                      --endpoint ppe-iris-species \
                      --model dbw_iris_ml_dev.ppe.iris_species \
                      --alias ppe
                  displayName: Point the endpoint at the alias version
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                    TARGET: ppe
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks serving-endpoints get ppe-iris-species
                  displayName: Verify endpoint status
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    python scripts/test_serving.py --endpoint ppe-iris-species --dry-run
                  displayName: Run serving inference smoke check
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

  - stage: deploy_prod
    displayName: Deploy prod from git branch main (approval gated)
    dependsOn: validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: iris-prod
    jobs:
      - deployment: deploy
        displayName: Deploy prod target
        environment: iris-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    set -euo pipefail
                    mkdir -p "$HOME/.local/bin"
                    curl -fsSL -o /tmp/databricks.zip \
                      "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
                    unzip -o /tmp/databricks.zip databricks -d "$HOME/.local/bin"
                    echo "##vso[task.prependpath]$HOME/.local/bin"
                    databricks version
                  displayName: Install Databricks CLI
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks bundle deploy -t prod --auto-approve --force-lock
                  displayName: Deploy prod bundle
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks bundle run iris-ml-job-pipeline -t prod
                  displayName: Run train-infer job pipeline
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    python scripts/apply_served_version.py \
                      --endpoint prod-iris-species \
                      --model dbw_iris_ml_dev.prod.iris_species \
                      --alias prod
                  displayName: Point the endpoint at the alias version
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                    TARGET: prod
                - script: |
                    set -euo pipefail
                    unset DATABRICKS_TOKEN
                    python scripts/cd_require_service_principal.py
                    databricks serving-endpoints get prod-iris-species
                  displayName: Verify endpoint status
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                - script: |
                    python scripts/test_serving.py --endpoint prod-iris-species --dry-run
                  displayName: Run serving inference smoke check
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
