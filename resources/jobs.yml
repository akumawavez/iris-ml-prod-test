resources:
  jobs:
    iris-train-notebook-personal:
      name: iris-train-notebook-personal
      tags:
        project: iris-ml
        env: develop
        task: notebook
        compute: personal
        managed-by: dab
        owner: ${var.owner}
      tasks:
        - task_key: train_notebook
          notebook_task:
            notebook_path: ../notebooks/01_train_and_register.ipynb
            base_parameters:
              MLFLOW_TRACKING_URI: databricks
              MLFLOW_EXPERIMENT_NAME: ${var.experiment_name}
              MLFLOW_REGISTERED_MODEL_NAME: ${var.registered_model_name}
              LLM_EXPLANATION_STYLE: concise
          existing_cluster_id: ${var.personal_compute_id}

    iris-train-script-serverless:
      name: iris-train-script-serverless
      tags:
        project: iris-ml
        env: develop
        task: script
        compute: serverless
        managed-by: dab
        owner: ${var.owner}
      tasks:
        - task_key: train_script
          spark_python_task:
            python_file: ../notebooks/train_register.py
            parameters:
              - --experiment
              - ${var.experiment_name}
              - --tracking-uri
              - databricks
              - --registered-name
              - ${var.registered_model_name}
              - --register
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - requirements-serving.txt
