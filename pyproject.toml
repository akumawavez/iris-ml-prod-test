[project]
name = "iris-model"
version = "0.1.0"
description = "Iris classifier with MLflow pyfunc + SHAP narratives (teaching repo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.6",
  "mlflow>=3.16",
  "pandas>=3.0",
  "scikit-learn>=1.9",
  "shap>=0.52",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pyyaml>=6.0",
  "ruff>=0.4",
  "pre-commit>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored agent skills keep their upstream formatting.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Legacy: zip over fixed 4-wide load_iris rows; strict= would add no safety.
"src/iris_model/train.py" = ["B905"]

[tool.ruff.format]
# Legacy scorer style is frozen (collapsing its comprehensions would breach
# E501); new files must be format-clean.
exclude = ["src/iris_model/score.py"]

[tool.uv]
package = true
