# Test-only CI (uv). Runs pytest on pull requests into develop, ppe, and main,
# and on pushes to those branches. main is the prod git branch. There is
# deliberately NO deploy step here — the serving
# endpoint stays off until the cost sheet (docs/cost-sheet.md) and the $10
# budget (docs/cost-tracker.md) are approved.
# In particular this file must never invoke a bundle deploy
# (enforced by tests/test_pipeline_contract.py).
#
# Run-only-when-required rules (cost control for the 1,800 free minutes):
# - batch: true — superseded pushes on one branch collapse into a single run.
# - paths filter — docs-only edits (*.md, docs/**) do not trigger a run.
# - PR trigger is develop, ppe, and main (the promotion line). No schedules.
# - The gated deploy path lives in azure-pipelines-cd.yml, which is
#   trigger:none / pr:none and is NOT created as a real pipeline until the
#   cost approval. This file never references it.
#
# Toolchain: uv only. `uv sync --locked` fails closed if uv.lock is stale;
# `requirements.txt` is the compiled output (`uv pip compile --universal`)
# for Databricks/AML readers — CI never pip-installs it.

trigger:
  batch: true
  branches:
    include:
      - develop
      - ppe
      - main
  paths:
    include:
      - src/**
      - tests/**
      - notebooks/**
      - models/**
      - requirements.txt
      - uv.lock
      - pyproject.toml
      - .python-version
      - azure-pipelines.yml
      - azure-pipelines-cd.yml
      - databricks.yml
      - databricks/**
    exclude:
      - docs/**
      - "**/*.md"

pr:
  branches:
    include:
      - develop
      - ppe
      - main
  paths:
    include:
      - src/**
      - tests/**
      - notebooks/**
      - models/**
      - requirements.txt
      - uv.lock
      - pyproject.toml
      - .python-version
      - azure-pipelines.yml
      - azure-pipelines-cd.yml
      - databricks.yml
      - databricks/**

# Tests do not reference the iris-develop variable group. An unauthorized
# or missing group fails the job during initialization, before any step runs.
# Bundle validate is a second job so a group problem cannot block pytest.
variables:
  - name: DATABRICKS_CLI_VERSION
    value: "0.272.1"

jobs:
  - job: test
    displayName: Test
    pool:
      vmImage: ubuntu-latest
    steps:
      # Install uv from the official script and put it on PATH for later steps.
      # `pip install uv` lands the binary in a directory the hosted agent does not
      # search, so `uv sync` exits before the lockfile is installed.
      - script: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.13
          uv sync --locked --extra dev
        displayName: Sync dependencies with uv

      - script: uv run pytest -q
        displayName: Run tests

      - script: |
          uv run ruff check .
          uv run ruff format --check .
        displayName: Lint

  - job: validate
    displayName: Validate Databricks bundle (no deploy)
    dependsOn: test
    pool:
      vmImage: ubuntu-latest
    variables:
      - group: iris-develop
    steps:
      - script: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/databricks.zip \
            "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
          unzip -o /tmp/databricks.zip databricks -d "$HOME/.local/bin"
          echo "##vso[task.prependpath]$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          databricks version
          databricks bundle validate -t develop
          databricks bundle validate -t ppe
          databricks bundle validate -t prod
        displayName: Validate Databricks bundle (no deploy)
        env:
          DATABRICKS_HOST: $(DATABRICKS_HOST)
          DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
