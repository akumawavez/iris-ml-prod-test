# Test-only CI. No deploy. Deploy is azure-pipelines-cd.yml, manual and gated.
#
# Branches:
# - Push runs only on develop, ppe, and main. A feature/* push does not.
# - Pull requests run only when the target is develop, ppe, or main.
#   That is the promotion line feature/* -> develop -> ppe -> main.
# - Draft pull requests do not run. There is no schedule.
# - batch: true collapses superseded pushes on one branch into one run.
# - Path filters skip docs-only edits so they do not spend the 1,800 free minutes.
#
# A folder name in paths includes everything under it. src/* would miss
# src/iris_model/*.py because * does not cross a slash.
#
# Toolchain: uv only, version pinned below. uv sync --locked fails if
# uv.lock is stale. CI never pip-installs requirements.txt.
#
# Identity: Microsoft-hosted agents have no managed identity. The job
# signs in as id-iris-ml through service connection sc-iris-keyvault,
# then reads sp-iris-develop-client-secret from Key Vault. The variable
# group holds the host and client id, not the password. A personal token
# is not passed in. See docs/guides/eli25-identities.md.

trigger:
  batch: true
  branches:
    include:
      - develop
      - ppe
      - main
  paths:
    include:
      - src
      - tests
      - notebooks
      - models
      - scripts
      - databricks
      - azure-pipelines
      - requirements.txt
      - uv.lock
      - pyproject.toml
      - .python-version
      - azure-pipelines.yml
      - azure-pipelines-cd.yml
      - databricks.yml
    exclude:
      - docs
      - "*.md"

pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - develop
      - ppe
      - main
  paths:
    include:
      - src
      - tests
      - notebooks
      - models
      - scripts
      - databricks
      - azure-pipelines
      - requirements.txt
      - uv.lock
      - pyproject.toml
      - .python-version
      - azure-pipelines.yml
      - azure-pipelines-cd.yml
      - databricks.yml
    exclude:
      - docs
      - "*.md"

pool:
  vmImage: ubuntu-latest

variables:
  - name: DATABRICKS_CLI_VERSION
    value: "0.272.1"
  - name: UV_VERSION
    value: "0.11.28"

jobs:
  - job: test
    displayName: Test and validate
    timeoutInMinutes: 30
    variables:
      - group: iris-develop
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false
        clean: true

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
        displayName: Use Python 3.13
        condition: succeeded()

      - script: |
          set -euo pipefail
          pip install "uv==$(UV_VERSION)"
          uv sync --locked --extra dev
        displayName: Sync dependencies with uv $(UV_VERSION)
        condition: succeeded()

      - script: |
          set -euo pipefail
          uv run pytest -q --junitxml=test-results.xml
        displayName: Run tests
        condition: succeeded()

      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: test-results.xml
          failTaskOnFailedTests: true
        displayName: Publish test results

      - script: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check .
        displayName: Lint
        condition: succeeded()

      - script: |
          set -euo pipefail
          uv run pre-commit run --all-files
        displayName: Pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        condition: succeeded()

      - template: azure-pipelines/steps-keyvault-secret.yml
        parameters:
          secretName: sp-iris-develop-client-secret

      - template: azure-pipelines/steps-databricks-cli.yml

      - template: azure-pipelines/steps-databricks-command.yml
        parameters:
          displayName: Validate Databricks bundle as sp-iris-develop (no deploy)
          script: |
            databricks bundle validate -t develop
            databricks bundle validate -t ppe
            databricks bundle validate -t prod
